const COSTN={};Object.keys(COST).forEach(k=>{const n=k.split("|")[0];(COSTN[n]=COSTN[n]||[]).push(COST[k]);});
function costFor(n,l){n=String(n).replace(/ \(.*\)$/,"");return COST[n+"|"+l]||(COSTN[n]&&COSTN[n].length===1?COSTN[n][0]:null);}
const tipKey=(n,l)=>String(n).replace(/ \(.*\)$/,"")+"|"+l;
const tipAttr=(n,l)=>costFor(n,l)?` data-tip="${tipKey(n,l)}"`:"";
const tipClass=(n,l)=>costFor(n,l)?" hastip":"";
const tipFocus=(n,l)=>costFor(n,l)?' tabindex="0"':"";
function bpSection(name){
  const list=BP[name];

}
function bpHtml(){

}
const tip=document.getElementById("tip");
function tipHtml(key){
  const [n,l]=key.split("|"),c=costFor(n,l),mats=c.m.map(x=>/^\d/.test(x)?`<li>${x}</li>`:`<li>${x} <span class="muted">(Menge nicht angegeben)</span></li>`).join("");
  return `<strong>${c.t||n}</strong><div class="tmeta">Ebene ${c.l} · ${c.r}</div><dl><dt>Coins</dt><dd>${c.c}</dd><dt>Seelen</dt><dd>${c.s}</dd><dt>Kaktus</dt><dd>${c.k}</dd></dl><ul>${mats}</ul><div class="tmeta">Quelle: PlayLegend Wiki</div>`;
}
function moveTip(x,y){
  const w=tip.offsetWidth,h=tip.offsetHeight,W=window.innerWidth||1000,H=window.innerHeight||800;
  let l=x+16,t=y+16;if(l+w>W-8)l=Math.max(8,x-w-16);if(t+h>H-8)t=Math.max(8,y-h-16);
  tip.style.left=l+"px";tip.style.top=t+"px";
}
const MOBALIAS={Skeleton:"Skelett",Schneeman:"Schneemann",Wither:"Witherskelett",Blaze:"Lohe","Hühner":"Huhn"};
function mobInfo(label){
  const m=/^(.*?)\s*T(\d+)$/.exec(label.trim());if(!m)return null;
  const name=MOBALIAS[m[1]]||m[1],tier=+m[2],w=WAVE[name+tier];
  const others=Object.keys(WAVE).map(k=>k.match(/^(.*?)(\d+)$/)).filter(x=>x&&x[1]===name).map(x=>({t:+x[2],w:WAVE[x[0]]})).sort((a,b)=>a.t-b.t);
  return {label:label.trim(),name,tier,w,others};
}
function mobTipHtml(label){
  const i=mobInfo(label);if(!i)return "";
  if(i.w)return `<strong>${i.label}</strong><div class="tmeta">Beste Welle für diese Essenz</div><dl><dt>Welle</dt><dd>${i.w}</dd></dl>`;
  const alt=i.others.length?`Vorhanden: ${i.others.map(o=>"T"+o.t+" (Welle "+o.w+")").join(", ")}`:"Keine Welle hinterlegt.";
  return `<strong>${i.label}</strong><div class="tmeta">Diese Essenz steht nicht in der Essenzliste.</div><div class="tmeta">${alt}</div>`;
}
function showTip(n,x,y){
  let html;
  if(n.startsWith("mob:")){
    html=mobTipHtml(n.slice(4));
    if(!html)return;
  }else{
    const [name,lvl]=n.split("|");
    if(!costFor(name,lvl))return;
    html=tipHtml(n);
  }
  tip.innerHTML=html;tip.dataset.n=n;tip.hidden=false;
  moveTip(x,y);
}
function hideTip(){tip.hidden=true;tip.dataset.n="";}
const touchOnly=()=>window.matchMedia&&window.matchMedia("(hover:none)").matches;
out.addEventListener("mouseover",e=>{if(touchOnly())return;const r=e.target.closest("[data-tip]");if(r)showTip(r.dataset.tip,e.clientX,e.clientY);});
out.addEventListener("mousemove",e=>{if(!tip.hidden&&!touchOnly())moveTip(e.clientX,e.clientY);});
out.addEventListener("mouseout",e=>{const r=e.target.closest("[data-tip]");if(r&&!r.contains(e.relatedTarget))hideTip();});
out.addEventListener("focusin",e=>{const c=e.target.closest("td.hastip,.mob");if(c){const b=c.getBoundingClientRect();showTip(c.dataset.tip||c.closest("tr").dataset.tip,b.left,b.bottom-8);}});
out.addEventListener("focusout",e=>{if(e.target.closest&&e.target.closest("td.hastip,.mob"))hideTip();});
out.addEventListener("click",e=>{
  if(!touchOnly())return;

});

const PLAN=[["1-13",603,"-","-"],["15-20",946,"Piglin T1","-"],["21-24",1141,"-","-"],["21-29",1237,"Endermite T2","-"],["25 + 30",1471,"-","Endermite T2"],["31-41",1929,"Wither T3, Endermite T2","-"],["31-34",1950,"-","Wither T3, Huhn T3, Blaze T3, Piglin T3"]];
function planLevels(t){
  let m=/^(\d+)\s*-\s*(\d+)$/.exec(t);
  if(m){const a=Math.max(2,+m[1]),b=Math.min(336,+m[2]),o=[];for(let L=a;L<=b;L++)o.push(L);return o;}
  m=/^(\d+)\s*\+\s*(\d+)$/.exec(t);
  return m?[+m[1],+m[2]]:[];
}
const mobKeyOf=x=>{const i=mobInfo(x);return i?i.name+i.tier:x;};
function planMobs(r){
  const miss=new Set(r[2]==="-"?[]:r[2].split(/,\s*/).map(mobKeyOf));
  const need=new Set(planLevels(r[0]).map(L=>SEQ[L-2]).filter(Boolean));
  if(r[3]!=="-")r[3].split(/,\s*/).forEach(x=>need.add(mobKeyOf(x)));
  const list=[...need].filter(k=>!miss.has(k)).map(k=>{const m=/^(.*?)(\d+)$/.exec(k);return m?{n:m[1],t:+m[2]}:{n:k,t:0};}).sort((a,b)=>a.t-b.t||a.n.localeCompare(b.n,"de"));
  return list.length?list.map(o=>o.t?`${o.n} T${o.t}`:o.n).join(", "):"-";
}
function planHtml(){
  const w=st.w||0,cur=w?PLAN.reduce((a,r,i)=>r[1]<=w?i:a,-1):-1;
  const body=PLAN.map((r,i)=>{
    const miss=r[2]==="-"?"-":r[2].split(/,\s*/).map(x=>mobInfo(x)?`<span class="mob" tabindex="0" data-tip="mob:${x}">${x}</span>`:x).join(", ");
    const mobs=planMobs(r);
    const cls=i===cur?"now":(w&&r[1]>w?"future":"");
    return `<tr class="${cls}"><td class="n">${r[0]}</td><td class="n">${r[1]}${i===cur?'<span class="here">Du bist hier</span>':""}</td><td class="${r[2]==="-"?"muted":"miss"}">${miss}</td><td class="${mobs==="-"?"muted":""}">${mobs}</td></tr>`;
  }).join("");
  return `<p class="notice"><b>Hinweis:</b> Diese Wellen kombinieren teilweise einzelne Machtkristall Level. Mit Hovern auf die Fehlenden Mobs kannst du sehen was die beste Welle für diese Essenz ist.</p>

}

/* Ingame-Menü: 9 Spalten, Titel in Pixel-Schrift */
function guiHtml(title,cells,rows=3,first=false){

}
function fnIcon(key,svg){
  const on=st.bsel===key;

function menuView(v){

  const open=Object.values(v.slots).some(s=>s[1]&&s[1]===st.bsel)?FN[st.bsel].html():"";

function toggleInfo(key){st.bsel=st.bsel===key?null:key;save();render();}
function minionHtml(){

  ${note("info","Info:","Das Minion-System (inkl. Entleeren der Tasche) ist erst mit dem <b>Fabriklvl 90</b> möglich.")}

  ${VIEWS[st.minion]?menuView(VIEWS[st.minion]):'<p class="mnhint">Wähle oben einen Bereich aus.</p>'}`;

function skillHtml(){
  const md=mode();
  const cur=SKT.find(t=>t[0]===st.skt)||SKT[0];
  const sel=`<div class="skt"><div class="sktw"><div class="seg" role="group" aria-label="Skilltree wählen">${SKT.map(t=>`<button type="button" data-skt="${t[0]}" aria-pressed="${t[0]===cur[0]}">${t[1]} ${sktPts(t[0])}/150${SKT_TIP(t[0])}</button>`).join("")}</div></div></div>`;
  const body=skillTree(cur[0],md!=="custom",md==="custom"?false:allocM(md,getBuy())[cur[0]]);
  if(md!=="custom")return sel+`<div class="skrow">${body}${buyHtml()}</div>`;
  const side=`<div class="skside"><button type="button" class="reset" data-skreset="cur">Diesen Baum zurücksetzen</button></div>`;
  return sel+`<div class="skrow">${side}${body}${buyHtml()}</div>`;
}
function skillTree(key,ro,full){
  useTree(key);
  st[SK]=st[SK]||{};
  const M=ro?(full===true?mcFull():(full&&typeof full==="object")?Object.fromEntries(Object.keys(full).map(id=>[MC_POS[id],full[id]])):{}):st[SK];
  const maxedAt=(y,x)=>MC[y]&&MC[y][x]&&!MC_NOSKILL.has(MC_ID_AT[y+","+x])&&(M[y+","+x]||0)>=mcMax(MC_ID_AT[y+","+x]);
  let c="";
  MC.forEach((row,y)=>row.forEach((it,x)=>{
    if(it){const ns=MC_NOSKILL.has(it[0]),n=M[y+","+x]||0,miss=ro?[]:mcMissing(it[0]),lk=ns||(miss.length>0&&n===0);
      const tip=it[1]+(ns?" (nicht skillbar)":lk?" (gesperrt: benötigt "+miss.map(m=>MC_NAME[m]).join(", ")+")":"");
      const d=MC_DESC[it[0]],side=(x<=2?" tl":x>=6?" tr":"")+(y<=1?" tb":"");
      const dt=d?`<div class="mct"><div class="mctt"><i>${MC_ICON[it[0]]}</i>${d[0]} (${n}/${mcMax(it[0])})</div><div class="mctd${d[2]?" w":""}">${d[1]}</div>${d[3]?`<div class="mctd w">${d[3]}</div>`:""}</div>`:"";
      c+=`<div class="mcs i${n>=mcMax(it[0])?" max":""}${lk?" lk":""}${ro?" ro":""}${FLASH&&FLASH.tree===key&&FLASH.id===it[0]?(FLASH.neg?" flash neg":" flash"):""}${d?" hd":""}${side}" data-mc="${y},${x}" data-id="${it[0]}" ${d?"":`data-n="${tip}"`} role="button" tabindex="0" aria-label="${d?d[0]:tip}${ns?"":" "+n+"/"+mcMax(it[0])}">${MC_ICON[it[0]]}${ns?"":`<span class="mcc">${n}/${mcMax(it[0])}</span>`}${dt}</div>`;
    }else if(MC_OLIVE.has(y+","+x)){
      const g=maxedAt(y-1,x)||maxedAt(y+1,x)||maxedAt(y,x-1)||maxedAt(y,x+1);
      c+=`<div class="mcs o${g?" g":""}"></div>`;
    }else c+=`<div class="mcs"></div>`;
  }));
  return `<div class="mc"><h2>${SK_TITLE}${mode()==="custom"?`<span class="skav">Verfügbare Punkte: <b>${availOf(key)}</b></span>`:""}</h2><div class="mcg">${c}</div></div>`;
}
function removeOne(tk,k){
  useTree(tk);const store=st[NODEKEY[tk]]||{},n=store[k]||0,id=MC_ID_AT[k];
  if(!n||!id||MC_NORESET.has(id))return false;
  if(n>=mcMax(id)&&Object.keys(MC_REQ).some(o=>MC_REQ[o].includes(id)&&((store[MC_POS[o]])||0)>0))return false;
  if(n>1)store[k]=n-1;else delete store[k];
  return true;
}
function removeAny(){
  const h=st.mh||[];
  for(let i=h.length-1;i>=0;i--){const [tk,k]=h[i];if(k==="base")continue;h.splice(i,1);if(removeOne(tk,k))return [tk,k];}
  for(const tk of ["kaktus","seele","forschung"])for(const k of Object.keys(st[NODEKEY[tk]]||{}))if(removeOne(tk,k))return [tk,k];
  return null;
}
function mcStep(el,dir){
  if(mode()!=="custom")return;
  useTree(curTree());
  if(!el||MC_NOSKILL.has(el.dataset.id))return;
  st[SK]=st[SK]||{};const k=el.dataset.mc,id=el.dataset.id;let n=st[SK][k]||0;
  if(dir>0){if(n>=mcMax(id)||mcMissing(id).length||(availOf(curTree())<=0&&getBuy()>=150))return;n++;}
  else{
    if(n===0||MC_NORESET.has(id))return;
    // nicht zurücknehmen, solange davon abhängige Felder Punkte haben
    if(n>=mcMax(id)&&Object.keys(MC_REQ).some(o=>MC_REQ[o].includes(id)&&mcCnt(o)>0))return;
    n--;
  }
  if(dir>0&&availOf(curTree())<=0){const c=curTree();st.mp[c]++;st.mb[c]=(st.mb[c]||0)+1;(st.mh=st.mh||[]).push([c,"base"]);setBuy(getBuy()+1);}
  if(n)st[SK][k]=n;else delete st[SK][k];
  const tk=curTree();
  st.mh=st.mh||[];
  if(dir>0)st.mh.push([tk,k]);else{for(let i=st.mh.length-1;i>=0;i--)if(st.mh[i][0]===tk&&st.mh[i][1]===k){st.mh.splice(i,1);break;}}
  save();render();
}
out.addEventListener("click",e=>{
  const bs=e.target.closest("[data-buyset]");
  if(st.tab==="skill"&&bs&&!bs.disabled){
    if(mode()==="custom"){mpInit();
      if(+bs.dataset.buyset>=150){const c=curTree(),d=150-getBuy();st.mp[c]+=d;st.mb[c]=(st.mb[c]||0)+d;}
      else{st.mc={};st.ms={};st.mf={};st.mp={kaktus:0,seele:0,forschung:0};st.mb={};st.mh=[];}
      setBuy(sumO(st.mp));}
    else setBuy(+bs.dataset.buyset);
    save();render();return;}
  const bb=e.target.closest("[data-buy]");
  if(st.tab==="skill"&&bb&&!bb.disabled){const dir=+bb.dataset.buy;
    const bm=mode();
    if(ORDERS[bm]){
      const y=getBuy(),ORD=ORDERS[bm]();
      if(dir>0||y>0){
        const step=ORD[dir>0?y:y-1];
        st.skt=step?step[0]:EXTRA_TREE[bm];
        FLASH=step?{tree:step[0],id:step[1],neg:dir<0}:null;
      }
    }
    if(bm==="custom"){
      mpInit();const cur=curTree();
      if(dir>0){if(getBuy()>=150)return;st.mp[cur]++;st.mb[cur]=(st.mb[cur]||0)+1;(st.mh=st.mh||[]).push([cur,"base"]);setBuy(getBuy()+1);save();render();return;}
      let T=availOf(cur)>0?cur:TK.find(k=>availOf(k)>0),fl=null;
      if(!T){const r=removeAny();if(!r)return;T=r[0];fl={tree:r[0],id:MC_ID_AT[r[1]],neg:true};}
      st.mp[T]--;
      if((st.mb[T]||0)>0){st.mb[T]--;const h=st.mh||[];for(let q=h.length-1;q>=0;q--)if(h[q][0]===T&&h[q][1]==="base"){h.splice(q,1);break;}}
      setBuy(getBuy()-1);st.skt=T;FLASH=fl;save();render();FLASH=null;return;}
    setBuy(getBuy()+dir);save();render();FLASH=null;return;}
  const r=e.target.closest("[data-skreset]");
  if(st.tab==="skill"&&r){
    const tk=curTree();mpInit();
    st.mh=(st.mh||[]).filter(h=>h[0]!==tk);
    st[NODEKEY[tk]]={};st.mp[tk]=0;st.mb[tk]=0;
    setBuy(sumO(st.mp));
    save();render();
  }
});
out.addEventListener("click",e=>{const b=e.target.closest("[data-skt]");if(st.tab==="skill"&&b){
  if(e.shiftKey&&mode()==="custom"){
    if(getBuy()<150){mpInit();st.mp[b.dataset.skt]++;st.mb[b.dataset.skt]=(st.mb[b.dataset.skt]||0)+1;(st.mh=st.mh||[]).push([b.dataset.skt,"base"]);setBuy(getBuy()+1);save();render();}
    return;}
  st.skt=b.dataset.skt;save();render();return;}});
out.addEventListener("click",e=>{if(st.tab==="skill")mcStep(e.target.closest("[data-mc]"),1);});
out.addEventListener("contextmenu",e=>{const el=e.target.closest("[data-mc]");if(st.tab==="skill"&&el){e.preventDefault();mcStep(el,-1);}});
out.addEventListener("keydown",e=>{if(st.tab==="minion"&&(e.key==="Enter"||e.key===" ")&&e.target.closest("[data-fn]")){e.preventDefault();toggleInfo(e.target.closest("[data-fn]").dataset.fn);return;}if(st.tab==="skill"&&(e.key==="Enter"||e.key===" ")){const el=e.target.closest("[data-mc]");if(el){e.preventDefault();mcStep(el,1);}}});
function lsubBar(){
  return `<div class="lsub"><div class="seg" role="group" aria-label="Ansicht"><button type="button" data-lsub="list" aria-pressed="${st.lsub!=="plan"}">Essenzen pro Level</button><button type="button" data-lsub="plan" aria-pressed="${st.lsub==="plan"}">Kombinierte Wellen</button></div></div>`;
}
function render(){
  build();
  document.getElementById("modes").hidden=st.tab!=="skill";
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode()));
  hideTip();
  document.getElementById("checkHead").hidden=st.tab!=="check";
  document.getElementById("progHead").hidden=st.tab!=="prog";
  const isEss=st.tab==="list"||st.tab==="check";
  document.getElementById("tList").setAttribute("aria-selected",isEss);
  document.getElementById("essSw").hidden=!isEss;
  document.getElementById("swList").setAttribute("aria-pressed",st.tab==="list");
  document.getElementById("swCheck").setAttribute("aria-pressed",st.tab==="check");
  document.getElementById("tProg").setAttribute("aria-selected",st.tab==="prog");
  document.getElementById("tSword").setAttribute("aria-selected",st.tab==="sword");
  document.getElementById("tAsp").setAttribute("aria-selected",st.tab==="asp");
  document.getElementById("tBp").setAttribute("aria-selected",st.tab==="bp");
  document.getElementById("tMinion").setAttribute("aria-selected",st.tab==="minion");
  document.getElementById("tSkill").setAttribute("aria-selected",st.tab==="skill");
  if(st.tab==="list"){out.innerHTML=lsubBar()+(st.lsub==="plan"?planHtml():listHtml());return;}
  if(st.tab==="sword"){out.innerHTML=swordHtml();return;}
  if(st.tab==="asp"){out.innerHTML=aspHtml();return;}
  if(st.tab==="bp"){out.innerHTML=bpHtml();return;}
  if(st.tab==="minion"){out.innerHTML=minionHtml();return;}
  if(st.tab==="skill"){out.innerHTML=skillHtml();return;}
  if(st.tab==="prog"){
    const sel=document.getElementById("progSel");
    if(!sel.options.length)Object.entries(PROG).forEach(([k,v])=>sel.add(new Option(v.title,k)));
    sel.value=st.prog;
    out.innerHTML=(PROG[st.prog]||PROG.coin).html();return;
  }
  document.getElementById("vTier").setAttribute("aria-pressed",st.view==="tier");
  document.getElementById("vAmt").setAttribute("aria-pressed",st.view==="amt");
  document.getElementById("hide").checked=st.hide;
  const ni=document.getElementById("n");if(document.activeElement!==ni)ni.value=st.n;
  const wi=document.getElementById("w");if(document.activeElement!==wi)wi.value=st.w||"";
  const li=document.getElementById("l");if(document.activeElement!==li)li.value=st.l||"";
  const fi=document.getElementById("f");if(document.activeElement!==fi)fi.value=st.f||"";

  const V=DATA.filter(okW);
  const all=V.reduce((s,d)=>s+d.amt,0)*st.n;
  const done=V.filter(isDone);
  const doneSum=V.reduce((s,d)=>s+prog(d),0);
  document.getElementById("allAmt").textContent=fmt(all);
  document.getElementById("doneAmt").textContent=fmt(doneSum);
  document.getElementById("doneCnt").textContent=done.length+" / "+V.length+" · "+Math.round(all?doneSum/all*100:0)+" %";
  document.getElementById("fill").style.width=(all?doneSum/all*100:0)+"%";

  if(st.view==="amt"){
    out.innerHTML=rows(DATA.filter(okW).sort((a,b)=>a.amt-b.amt||a.tier-b.tier||a.name.localeCompare(b.name)));
  }else{
    let h="";
    for(let t=1;t<=12;t++){
      const list=DATA.filter(d=>d.tier===t&&okW(d)).sort(byAmt);
      if(!list.length)continue;
      const sum=list.reduce((s,d)=>s+d.amt,0)*st.n;
      const ds=list.reduce((s,d)=>s+prog(d),0);
      h+=`<section style="--c:var(--t${(t-1)%6+1})"><div class="tierhead"><h2>Tier ${t}</h2><span>${fmt(ds)} / ${fmt(sum)}</span></div>${rows(list)}</section>`;
    }
    out.innerHTML=h;
  }
