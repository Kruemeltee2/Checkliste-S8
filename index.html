<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S8 Checkliste</title>
<style>
:root{
  --bg:#f3f4f1; --surface:#fff; --ink:#1d2320; --muted:#667069; --line:#dfe3dc;
  --accent:#2f6f4f; --accent-ink:#fff; --done:#9aa39c;
  --t1:#7d8b99; --t2:#4f9a5b; --t3:#3d86c6; --t4:#8a63c9; --t5:#d08a2e; --t6:#c9473f;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141816; --surface:#1d2320; --ink:#e7ece8; --muted:#8f9a93; --line:#2c3530;
    --accent:#5fbf8a; --accent-ink:#0f1a14; --done:#5d6861; }
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 12px}
.wrap{max-width:1040px;margin:0 auto}
h1{margin:0 0 8px;font-size:1.35rem;font-weight:700}
.tabs{display:flex;gap:4px;margin:0 0 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{white-space:nowrap}
.sub{font-size:.88rem;color:var(--muted)}
.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);padding:6px 14px 8px;font:inherit;font-weight:600;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
table.ro tbody tr{cursor:default}
table.ro tbody tr:hover{background:transparent}
#progSel{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);margin-bottom:2px;min-width:14em}
.ptitle{margin:0 0 8px;font-size:1.2rem}.ptitle span{color:var(--muted);font-weight:500}
.stage{margin-bottom:12px}
.pmeta{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:.92rem;color:var(--muted)}
.bar+table{margin-top:14px}
.ctr{text-align:center}th.ctr{text-align:center}
.chip{--cc:#8f2fd9;display:inline-flex;align-items:center;gap:8px;min-width:8.5em;padding:3px 14px 3px 10px;border-radius:999px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--cc) 17%,transparent);border:1px solid color-mix(in srgb,var(--cc) 55%,transparent);transition:opacity .15s}
.chip::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--cc)}
tbody tr.done .chip{opacity:.5}
.chip{white-space:nowrap}
table.asp th,table.asp td{white-space:nowrap}
.scroll{overflow-x:auto;border-radius:10px}
.bar+.scroll{margin-top:14px}
.bp{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;align-items:start}
.bp>div{min-width:0}
.bp h2{margin:0 0 8px;font-size:1.15rem}.bp h2 span{color:var(--muted);font-weight:500;font-size:.9rem}
.bp section{margin-bottom:22px}
.bp td,.bp th{white-space:nowrap}
@media (max-width:700px){.bp{grid-template-columns:1fr}}
.hint{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.hastip{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
td.hastip:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.bp tr[data-tip]:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.tip{position:fixed;z-index:30;left:0;top:0;max-width:340px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:.9rem;pointer-events:none}
.tip[hidden]{display:none}
.tip .tmeta{color:var(--muted);font-size:.82rem}
.tip .muted{color:var(--muted)}
.tip dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:8px 0}
.tip dt{color:var(--muted)}
.tip dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.tip ul{margin:6px 0 8px;padding-left:18px}
td.warn{background:color-mix(in srgb,#e53935 24%,transparent);color:var(--ink)}
.callout{margin-top:18px;padding:12px 16px;background:color-mix(in srgb,#e53935 12%,var(--surface));border:1px solid color-mix(in srgb,#e53935 45%,transparent);border-left:5px solid #e53935;border-radius:10px}
.callout b{display:block;margin-bottom:2px}
.chip.b{--cc:#4a8be0}.chip.o{--cc:#f29a00}td.e.warn{background:color-mix(in srgb,#e53935 24%,transparent);color:var(--ink)}
.chip.g{--cc:#5fa84d}.chip.n{--cc:#8a928c}
.notes{margin-top:18px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px}
.notes h3{margin:0 0 6px;font-size:1rem}.notes ul{margin:0;padding-left:20px}.notes li{margin:3px 0}
.total{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--muted);margin-bottom:6px}
.total b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:7px 14px;font:inherit;font-size:.92rem;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
label.opt{display:flex;align-items:center;gap:6px;font-size:.92rem;cursor:pointer}
.reset{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.reset:hover{color:var(--ink)}
#n,#w,#l,#f{width:5.5em;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:16px}
section{margin-bottom:22px}
.tierhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 6px;padding-left:10px;border-left:5px solid var(--c)}
.tierhead h2{margin:0;font-size:1.1rem}
.tierhead span{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 12px;text-align:left}
th{font-size:.82rem;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
td{border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.nc,th.nc{text-align:center;font-variant-numeric:tabular-nums}
td.c,th.c{width:44px;padding-right:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
tbody tr.done td{color:var(--done)}
tbody tr.done td.e{text-decoration:line-through}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;margin:0;vertical-align:middle}
.tag{display:inline-block;min-width:2.2em;text-align:center;font-size:.78rem;font-weight:700;color:#fff;border-radius:5px;padding:1px 6px;margin-left:8px;background:var(--c)}
.empty{padding:18px;text-align:center;color:var(--muted)}
</style>
</head>

<header><div class="wrap">
  <h1>S8 Checkliste</h1>
  <nav class="tabs" role="tablist">
    <button id="tList" type="button" role="tab">Essenzen</button>
    <button id="tCheck" type="button" role="tab">Essenz Checkliste</button>
    <button id="tProg" type="button" role="tab">Ausrüstungssets</button>

    <label class="opt">Aktuelle Welle <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" id="w" placeholder="alle"></label>
    <label class="opt">Machtkristalle <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" id="n" value="1"></label>
    <label class="opt"><input type="checkbox" id="hide"> Erledigte ausblenden</label>
    <button class="reset" id="reset" type="button">Zurücksetzen</button>
  </div>
  </div>
</div></header>
<main><div class="wrap" id="out"></div></main>

let DATA=[];
function build(){
  const cap=st.l||336,from=st.f||2,agg={};
  SEQ.forEach((k,i)=>{if(i+2<=cap&&i+2>=from)agg[k]=(agg[k]||0)+(i+3)*1000;});
  DATA=Object.keys(agg).map(k=>{const m=k.match(/^(.*?)(\d+)$/);return {amt:agg[k],name:m[1],tier:+m[2],wave:WAVE[k],key:m[1]+"|"+m[2]};});
}

const KEY="essenzen-tracker-v2";
let st={done:{},view:"tier",hide:false,n:1,w:null,l:null,f:null,tab:"check",prog:"coin",coin:{},skl:{},swd:{},asp:{},stg:{},stage:"early"};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.done)st={...st,...s};}catch(e){}
if(!(st.n>=1))st.n=1;
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

const fmt=n=>n.toLocaleString("de-DE");
const out=document.getElementById("out");
const need=d=>d.amt*st.n;
const prog=d=>st.done[d.key]?need(d):0;
const isDone=d=>prog(d)>=need(d);
const okW=d=>!st.w||d.wave<=st.w;
const byAmt=(a,b)=>b.amt-a.amt||b.tier-a.tier||a.name.localeCompare(b.name);

function rows(list,showTag){
  const vis=list.filter(d=>okW(d)&&!(st.hide&&isDone(d)));
  if(!vis.length)return '<div class="empty">Keine Einträge: alles erledigt oder noch nicht farmbar.</div>';
  return '<table><thead><tr><th class="c"></th><th class="nc">Menge</th>'+'<th>Essenz</th><th class="n">Welle</th></tr></thead><tbody>'+
    vis.map(d=>`<tr data-k="${d.key}" class="${isDone(d)?"done":""}">
      <td class="c"><input type="checkbox" aria-label="${d.name} T${d.tier} gefarmt" ${isDone(d)?"checked":""}></td>
      <td class="nc">${fmt(d.amt*st.n)}</td>
      <td class="e">${d.name} T${d.tier}</td>
      <td class="n">${d.wave}</td></tr>`).join("")+'</tbody></table>';
}

const COSTN={};Object.keys(COST).forEach(k=>{const n=k.split("|")[0];(COSTN[n]=COSTN[n]||[]).push(COST[k]);});
function costFor(n,l){n=String(n).replace(/ \(.*\)$/,"");return COST[n+"|"+l]||(COSTN[n]&&COSTN[n].length===1?COSTN[n][0]:null);}
const tipKey=(n,l)=>String(n).replace(/ \(.*\)$/,"")+"|"+l;
const tr_=(n,l)=>costFor(n,l)?` data-tip="${tipKey(n,l)}"`:"";
const tc_=(n,l)=>costFor(n,l)?" hastip":"";
const ta_=(n,l)=>costFor(n,l)?' tabindex="0"':"";
function bpSection(name){
  const list=BP[name];
  return `<section><h2>${name} <span>${list.length}</span></h2><div class="scroll"><table class="ro"><thead><tr><th>Name</th><th class="ctr">Ebene</th></tr></thead><tbody>${list.map(r=>{const [n,l]=r.split("|");return `<tr><td>${n}</td><td class="ctr">${l}</td></tr>`;}).join("")}</tbody></table></div></section>`;
}
function bpHtml(){
  return `<div class="bp"><div>${bpSection("Waffen")}${bpSection("Werkzeuge")}</div><div>${bpSection("Rüstung")}</div></div>`;
}
const tip=document.getElementById("tip");
function tipHtml(key){
  const [n,l]=key.split("|"),c=costFor(n,l),mats=c.m.map(x=>/^\d/.test(x)?`<li>${x}</li>`:`<li>${x} <span class="muted">(Menge nicht angegeben)</span></li>`).join("");
  return `<strong>${c.t||n}</strong><div class="tmeta">Ebene ${c.l} · ${c.r}</div><dl><dt>Coins</dt><dd>${c.c}</dd><dt>Seelen</dt><dd>${c.s}</dd><dt>Kaktus</dt><dd>${c.k}</dd></dl><ul>${mats}</ul><div class="tmeta">Quelle: PlayLegend Wiki</div>`;
}
function moveTip(x,y){
  const w=tip.offsetWidth,h=tip.offsetHeight,W=window.innerWidth||1000,H=window.innerHeight||800;
  let l=x+16,t=y+16;if(l+w>W-8)l=Math.max(8,x-w-16);if(t+h>H-8)t=Math.max(8,y-h-16);
  tip.style.left=l+"px";tip.style.top=t+"px";
}
function showTip(n,x,y){const kk=n.split("|");if(!costFor(kk[0],kk[1]))return;tip.innerHTML=tipHtml(n);tip.dataset.n=n;tip.hidden=false;moveTip(x,y);}
function hideTip(){tip.hidden=true;tip.dataset.n="";}
const touchOnly=()=>window.matchMedia&&window.matchMedia("(hover:none)").matches;
out.addEventListener("mouseover",e=>{if(touchOnly())return;const r=e.target.closest("tr[data-tip]");if(r)showTip(r.dataset.tip,e.clientX,e.clientY);});
out.addEventListener("mousemove",e=>{if(!tip.hidden&&!touchOnly())moveTip(e.clientX,e.clientY);});
out.addEventListener("mouseout",e=>{const r=e.target.closest("tr[data-tip]");if(r&&!r.contains(e.relatedTarget))hideTip();});
out.addEventListener("focusin",e=>{const c=e.target.closest("td.hastip");if(c){const b=c.getBoundingClientRect();showTip(c.closest("tr").dataset.tip,b.left,b.bottom-8);}});
out.addEventListener("focusout",e=>{if(e.target.closest&&e.target.closest("td.hastip"))hideTip();});
out.addEventListener("click",e=>{
  if(!touchOnly())return;
  const r=e.target.closest("tr[data-tip]");
  if(!r||tip.dataset.n===r.dataset.tip){hideTip();return;}
  showTip(r.dataset.tip,e.clientX,e.clientY);
});
function listHtml(){
  return '<table class="ro"><thead><tr><th class="n">Level</th><th class="nc">Menge</th><th>Essenz</th><th class="n">Welle</th></tr></thead><tbody>'+
    SEQ.map((k,i)=>{const m=k.match(/^(.*?)(\d+)$/);
      return `<tr><td class="n">${i+2}</td><td class="nc">${fmt((i+3)*1000)}</td><td>${m[1]} T${m[2]}</td><td class="n">${WAVE[k]}</td></tr>`;}).join("")+'</tbody></table>';
}

  build();
  hideTip();
  document.getElementById("checkHead").hidden=st.tab!=="check";
  document.getElementById("progHead").hidden=st.tab!=="prog";

  }

  const all=V.reduce((s,d)=>s+d.amt,0)*st.n;
  const done=V.filter(isDone);
  const doneSum=V.reduce((s,d)=>s+prog(d),0);
  document.getElementById("allAmt").textContent=fmt(all);
  document.getElementById("doneAmt").textContent=fmt(doneSum);
  document.getElementById("doneCnt").textContent=done.length+" / "+V.length+" · "+Math.round(all?doneSum/all*100:0)+" %";
  document.getElementById("fill").style.width=(all?doneSum/all*100:0)+"%";

  if(st.view==="amt"){
    out.innerHTML=rows(DATA.filter(okW).sort((a,b)=>a.amt-b.amt||a.tier-b.tier||a.name.localeCompare(b.name)));
  }else{
    let h="";
    for(let t=1;t<=12;t++){
      const list=DATA.filter(d=>d.tier===t&&okW(d)).sort(byAmt);
      if(!list.length)continue;
      const sum=list.reduce((s,d)=>s+d.amt,0)*st.n;
      const ds=list.reduce((s,d)=>s+prog(d),0);
      h+=`<section style="--c:var(--t${(t-1)%6+1})"><div class="tierhead"><h2>Tier ${t}</h2><span>${fmt(ds)} / ${fmt(sum)}</span></div>${rows(list)}</section>`;
    }
    out.innerHTML=h;
  }
}

function toggle(k){
  if(st.done[k])delete st.done[k];else st.done[k]=true;
  save();render();
}
out.addEventListener("click",e=>{
  const ar=e.target.closest("tr[data-a]");
  if(ar){const k=ar.dataset.a,store=st.asp||(st.asp={});if(store[k])delete store[k];else store[k]=true;save();render();return;}
  if(e.target.id==="aspReset"){if(confirm("Alle Häkchen der AC Aspekte zurücksetzen?")){st.asp={};save();render();}return;}
  const sr=e.target.closest("tr[data-s]");
  if(sr){const k=sr.dataset.s,store=st.swd||(st.swd={});if(store[k])delete store[k];else store[k]=true;save();render();return;}
  if(e.target.id==="swordReset"){if(confirm("Alle Häkchen der Waffen Progression zurücksetzen?")){st.swd={};save();render();}return;}
  const S=curSet();
  const sb=e.target.closest("[data-stage]");
  if(sb){st.stg=st.stg||{};st.stg[S.id]=sb.dataset.stage;save();render();return;}
  const cr=e.target.closest("tr[data-c]");
  if(cr){const k=cr.dataset.c,store=st[S.store]||(st[S.store]={});if(store[k])delete store[k];else store[k]=true;save();render();return;}
  if(e.target.id==="coinReset"){const g=curStage(S),store=st[S.store]||(st[S.store]={});if(confirm("Alle Häkchen dieses Stadiums zurücksetzen?")){S.data[g].rows.forEach(r=>delete store[ckey(S,g,r)]);save();render();}return;}
  const tr=e.target.closest("tr[data-k]");
  if(!tr)return;
  if(e.target.tagName==="INPUT"){toggle(tr.dataset.k);return;}
  toggle(tr.dataset.k);
});
document.getElementById("tBp").onclick=()=>{st.tab="bp";save();render();window.scrollTo(0,0);};
document.getElementById("tAsp").onclick=()=>{st.tab="asp";save();render();window.scrollTo(0,0);};
document.getElementById("tSword").onclick=()=>{st.tab="sword";save();render();window.scrollTo(0,0);};
document.getElementById("tProg").onclick=()=>{st.tab="prog";save();render();window.scrollTo(0,0);};
document.getElementById("progSel").onchange=e=>{st.prog=e.target.value;save();render();};
document.getElementById("tList").onclick=()=>{st.tab="list";save();render();window.scrollTo(0,0);};
document.getElementById("tCheck").onclick=()=>{st.tab="check";save();render();window.scrollTo(0,0);};
document.getElementById("vTier").onclick=()=>{st.view="tier";save();render();};
document.getElementById("vAmt").onclick=()=>{st.view="amt";save();render();};
document.getElementById("f").oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"");const v=Math.floor(+e.target.value);st.f=v>=2?Math.min(v,336):null;save();render();};
document.getElementById("l").oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"");const v=Math.floor(+e.target.value);st.l=v>=2?Math.min(v,336):null;save();render();};
document.getElementById("w").oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"");const v=Math.floor(+e.target.value);st.w=v>0?v:null;save();render();};
document.getElementById("n").oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"");const v=Math.floor(+e.target.value);if(v>=1){st.n=Math.min(v,9999);save();render();}};
document.getElementById("hide").onchange=e=>{st.hide=e.target.checked;save();render();};
document.getElementById("reset").onclick=()=>{
  if(confirm("Alle Häkchen zurücksetzen?")){st.done={};save();render();}
};
render();
</script>
